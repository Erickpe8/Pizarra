name: pizarra

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pizarra_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - path: .env.docker
        required: false
    environment:
      APP_NAME: ${APP_NAME:-Pizarra}
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-pizarra}
      DB_USERNAME: ${DB_USERNAME:-pizarra}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ./:/var/www/html
      - pizarra_vendor:/var/www/html/vendor
      - pizarra_node_modules:/var/www/html/node_modules
    networks:
      - pizarra
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s

  nginx:
    image: nginx:1.27-alpine
    container_name: pizarra_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pizarra
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: pizarra_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pizarra}
      MYSQL_USER: ${DB_USERNAME:-pizarra}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - pizarra_mysql_data:/var/lib/mysql
    networks:
      - pizarra
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  node:
    image: node:22-bookworm-slim
    container_name: pizarra_node
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./:/var/www/html
      - pizarra_vendor:/var/www/html/vendor
      - pizarra_node_modules:/var/www/html/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - pizarra
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

networks:
  pizarra:
    driver: bridge

volumes:
  pizarra_mysql_data:
  pizarra_vendor:
  pizarra_node_modules:
