name: pizarra

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pizarra_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - path: .env.docker
        required: false
    environment:
      APP_NAME: ${APP_NAME:-Pizarra}
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-pizarra}
      DB_USERNAME: ${DB_USERNAME:-pizarra}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      COMPOSER_MEMORY_LIMIT: "384M"
    volumes:
      - ./:/var/www/html
      - pizarra_vendor:/var/www/html/vendor
    networks:
      - pizarra
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 192m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 120s

  nginx:
    image: nginx:1.27-alpine
    container_name: pizarra_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pizarra
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 32m
    cpus: 0.20

  mysql:
    image: mysql:8.4
    container_name: pizarra_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pizarra}
      MYSQL_USER: ${DB_USERNAME:-pizarra}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - pizarra_mysql_data:/var/lib/mysql
      - ./docker/mysql/low-memory.cnf:/etc/mysql/conf.d/low-memory.cnf:ro
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --skip-name-resolve
      - --max-connections=15
      - --table-open-cache=64
      - --tmp-table-size=8M
      - --max-heap-table-size=8M
    networks:
      - pizarra
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Solo cuando necesites hot-reload de Vite/Tailwind:
  # docker compose --env-file .env.docker --profile frontend up -d
  node:
    profiles: ["frontend"]
    image: node:22-alpine
    container_name: pizarra_node
    working_dir: /var/www/html
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./:/var/www/html
      - pizarra_node_modules:/var/www/html/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - pizarra
    mem_limit: 384m
    cpus: 0.50
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

networks:
  pizarra:
    driver: bridge

volumes:
  pizarra_mysql_data:
  pizarra_vendor:
  pizarra_node_modules:
