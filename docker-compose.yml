name: pizarra

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pizarra_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8001}:80"
    environment:
      DOCKER_DEV: "1"
      APP_NAME: ${APP_NAME:-Pizarra}
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8001}

      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-pizarra}
      DB_USERNAME: ${DB_USERNAME:-pizarra}
      DB_PASSWORD: ${DB_PASSWORD:-secret}

      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: "6379"
      RUN_MIGRATIONS_ON_BOOT: "1"
      COMPOSER_MEMORY_LIMIT: "512M"
    volumes:
      - .:/var/www/html
      - pizarra_vendor:/var/www/html/vendor
      - pizarra_node_modules:/var/www/html/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: mariadb:11.6
    container_name: pizarra_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pizarra}
      MYSQL_USER: ${DB_USERNAME:-pizarra}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-3308}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - pizarra_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: pizarra_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pizarra_redis_data:/data

  # Opcional: hot-reload de Vite/Tailwind
  # docker compose --env-file .env.docker --profile frontend up -d
  node:
    profiles: ["frontend"]
    image: node:22-alpine
    container_name: pizarra_node
    working_dir: /var/www/html
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/var/www/html
      - pizarra_node_modules:/var/www/html/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  pizarra_db_data:
  pizarra_redis_data:
  pizarra_vendor:
  pizarra_node_modules:
